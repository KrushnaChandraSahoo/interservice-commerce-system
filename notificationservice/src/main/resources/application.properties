spring.application.name=notificationservice

server.port=8088

# ---------- Kafka Consumer ----------
spring.kafka.bootstrap-servers=localhost:9092
# --- Consumer identity ---
spring.kafka.consumer.group-id=notification-service-group

# 1. Wrap the real deserializer in ErrorHandlingDeserializer
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

# 2. Tell ErrorHandlingDeserializer what the REAL deserializers are
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

# 3. THIS IS THE MISSING PIECE: tell Jackson what class to create
spring.kafka.consumer.properties.spring.json.value.default.type=com.notificationservice.event.UserCreateEvent

# 4. Producer does not send type headers, so do not look for them
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# 5. Allow your package to be deserialized
spring.kafka.consumer.properties.spring.json.trusted.packages=com.notificationservice.event

spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=manual

