spring.application.name=user-service
server.port=8081
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:user_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=MYsql@2023
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

# ---------- Kafka ----------
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# wait until the broker confirms the write, so no message is lost
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3

# a retry never stores the same message twice
spring.kafka.producer.properties.enable.idempotence=true

# don't add the Java class name to the message, because consumers are separate projects
spring.kafka.producer.properties.spring.json.add.type.headers=false
